<html>
<head>
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="card">
        <div class="card-header">
            <h2>User Profile Card</h2>
        </div>

        <div class="card-body">
            <img src="cutecat.jpeg" alt="Profile Picture" class="profile-pic">

            <h3 class="login">hhumaira 42</h3>

            <p class="description">Level 7</p>

            <table class="info-table">
                <tr>
                    <td class="label">Campus:</td>
                    <td>42kl</td>
                </tr>
                <tr>
                    <td class="label">Status:</td>
                    <td>Active</td>
                </tr>
            </table>

            <div class="social-networks">
                <a href="https://www.instagram.com" target="_blank"><img src="instagram.jpeg" alt="Instagram"></a>
                <a href="https://www.linkedin.com" target="_blank"><img src="linkedin.png" alt="Linkedin"></a>
                <a href="https://www.facebook.com" target="_blank"><img src="facebook.png" alt="Facebook"></a>
            </div>
        </div>

        <div class="card-footer">
            <button class="contact-btn" onclick="alert('hi there')">Contact</button>
        </div>
    </div>

</body>
</html>
