<html>
<head>
    <title>Basics</title>

    <style>
        body {
            background-color: pink;
            margin: 0;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 50px;
        }

        .shops {
            display: flex;
            justify-content: center;
            gap: 50px;
            text-align: center;
        }

        .shop {
            width: 300px;
        }

        .shop img {
            width: 300px;
            height: 200px;
            object-fit: contain;
        }

        .shop a {
            display: block;
            margin-top: 10px;
        }
	a{
 	text-decoration:none;

	}
        hr {
            width: 100%;
            margin-top: 40px;
        }

        footer {
            text-align: right;
            font-family: monospace;
            font-style: italic;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>Basics &amp; Online Shops</h1>

    <div class="shops">
        <div class="shop">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon">
            <a href="https://www.amazon.com/" target="_blank">Amazon</a>
        </div>

        <div class="shop">
            <img src="shopee.png" alt="Shopee">
            <a href="https://shopee.com/" target="_blank">Shopee</a>
        </div>
    </div>

    <hr>

    <footer>
        &copy; hhumaira 2026
    </footer>

</body>
</html>
